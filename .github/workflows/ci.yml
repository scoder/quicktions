name: CI tests

on:
  push:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)


jobs:

  sdist:
    runs-on: ubuntu-latest

    steps:
    - name: Check out project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install Dependency
      run: |
        python -m pip install -U pip setuptools && python -m pip install -r requirements.txt

    - name: Build sdist
      run: make sdist

    - name: Archive sdist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: ignore


  Tests:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # List special Pythons first to keep the 'normal' one as (last) "python3.xy".
        python-version: |
          3.9
          3.10
          3.11
          3.12
          3.13
          3.13t
          3.14
          3.14t
          3.15
          3.15t
          3.16-dev
          3.16t-dev

    - name: Install Dependencies
      run: |
        which python3.10
        for PYVER in ${{ env.PYTHON_VERSIONS }}; do \
          if [[ -n "$${PYVER#3.9}" ]]; then python$${PYVER%-dev} -m pip install -U pip setuptools || exit 1; fi; \
          python$${PYVER%-dev} -m pip install -r requirements.txt || exit 1; \
        done

    - name: Build
      continue-on-error: ${{ matrix.allowed_failure || false }}
      run: for PYVER in ${{ env.PYTHON_VERSIONS }}; do make PYTHON=python$${PYVER%-dev} local || exit 1; done

    - name: Run slow tests
      continue-on-error: ${{ matrix.allowed_failure || false }}
      run: for PYVER in ${{ env.PYTHON_VERSIONS }}; do make PYTHON=python$${PYVER%-dev} testslow || exit 1; done

    - name: Running benchmark
      run: |
        # Run different benchmarks.
        for PYVER in ${{ env.PYTHON_VERSIONS }}; do \
          date; echo "Running telco benchmark in Python $${PYVER} ..."; \
          python benchmark/telco_fractions.py -n 250; \
        done
        for PYVER in ${{ env.PYTHON_VERSIONS }}; do \
          date; echo "Running micro benchmarks in Python $${PYVER} ..."; \
          python benchmark/microbench.py create pidigits; \
        done
        date; echo "Done."


  Linux:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux2014_i686
          - manylinux2014_x86_64
          - manylinux_2_34_x86_64
          - musllinux_1_1_x86_64
          - musllinux_1_2_x86_64
          - manylinux2014_aarch64
          - manylinux_2_34_aarch64

    runs-on: ${{ endsWith(matrix.image, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest'}}

    steps:
    - name: Check out project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install Dependency
      run: |
        if [[ "${{ matrix.python-version }}" != "3.9" ]]; then python -m pip install -U pip setuptools || exit 1; fi
        python -m pip install --pre -r requirements.txt

    - name: Building wheel
      run: |
        make sdist wheel_${{ matrix.image }}

    - name: Copy wheels in dist
      run: cp -v wheelhouse*/*-m*linux*.whl dist/  # manylinux / musllinux

    - name: Archive Wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.image }}
        path: dist/*.whl
        if-no-files-found: ignore


  non-Linux:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: [macos-latest, windows-latest]
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          - "3.16-dev"
          - "3.16t-dev"

        #include:
        #  - python-version: "3.16-dev"
        #    allowed_failure: true

    runs-on: ${{ matrix.os }}
    env: { MACOSX_DEPLOYMENT_TARGET: 11.0 }

    steps:
    - name: Check out project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -U pip setuptools
        python -m pip install --pre -r requirements.txt

    - name: Build wheels
      run: make sdist wheel

    - name: Run slow tests
      run: make testslow

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl
        if-no-files-found: ignore

    - name: Running benchmark
      run: |
        # Run different benchmarks.
        date; echo "Running telco benchmark ..."
        python benchmark/telco_fractions.py -n 250
        date; echo "Running micro benchmarks ..."
        python benchmark/microbench.py create pidigits
        date; echo "Done."


  merge-wheels:
    needs: [ Linux, non-Linux ]
    runs-on: ubuntu-latest

    steps:
    - name: Merge wheels
      uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: all_wheels
        pattern: wheels-*
        delete-merged: true
        compression-level: 9
